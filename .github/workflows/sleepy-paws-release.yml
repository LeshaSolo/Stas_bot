name: Sleepy Paws Release

on:
  push:
    paths:
      - "SleepyPaws/SleepyPaws.apk"
      - "SleepyPaws/README.md"
      - ".github/workflows/sleepy-paws-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sleepy-paws-v0.2.0+20
          TITLE: Sleepy Paws 0.2.0
        run: |
          cat > /tmp/sleepy-paws-notes.md <<'NOTES'
          versionCode: 20

          - Added Mimi Mouse as the first mini-world.
          - Added 5 playable mouse levels with unique goals.
          - Added Mimi idle spritesheet, mouse tile set, cozy nook home, soft obstacles, and home progress.
          - Switched Phaser to Canvas renderer for more reliable WebView/headless rendering.
          - Keeps package id com.sleepypaws.game for in-app updates.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" SleepyPaws/SleepyPaws.apk#SleepyPaws.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file /tmp/sleepy-paws-notes.md
          else
            gh release create "$TAG" SleepyPaws/SleepyPaws.apk#SleepyPaws.apk --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file /tmp/sleepy-paws-notes.md
          fi
