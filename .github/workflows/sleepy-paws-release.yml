name: Sleepy Paws Release

on:
  push:
    paths:
      - "SleepyPaws/SleepyPaws.apk"
      - "SleepyPaws/README.md"
      - ".github/workflows/sleepy-paws-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: sleepy-paws-v0.1.1+11
          TITLE: Sleepy Paws 0.1.1
        run: |
          cat > /tmp/sleepy-paws-notes.md <<'NOTES'
          versionCode: 11

          - Added mobile swipe/drag swapping in addition to tap-tap swapping.
          - Added valid-move validation and automatic board reshuffle when no moves remain.
          - Added score feedback on the test level.
          - Keeps package id com.sleepypaws.game for in-app updates from Sleepy Paws 0.1.0 and newer.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" SleepyPaws/SleepyPaws.apk#SleepyPaws.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file /tmp/sleepy-paws-notes.md
          else
            gh release create "$TAG" SleepyPaws/SleepyPaws.apk#SleepyPaws.apk --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file /tmp/sleepy-paws-notes.md
          fi
